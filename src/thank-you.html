<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Your Playbook is ready | Padilla Advisory Group</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#02193C;--gold:#E6B457;--gold-bright:#F4BB54;--paper:#F7F5EF;--ink:#1B2430;
        --serif:'Cormorant Garamond',Georgia,serif;--sans:'Libre Franklin',-apple-system,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#02193C 0%,#0a244a 55%,#03152f 100%);color:var(--paper);
    font-family:var(--sans);text-align:center;padding:2rem;}
  .card{max-width:560px;}
  .logo{height:44px;margin:0 auto 2.4rem;display:block;}
  .eyebrow{font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,6vw,3.4rem);color:#fff;line-height:1.08;margin:.8rem 0 1rem;}
  p{color:#C9D0DC;font-size:1.1rem;line-height:1.6;margin:0 auto 2rem;max-width:44ch;}
  .btn{display:inline-block;background:var(--gold);color:var(--navy);font-family:var(--sans);font-weight:600;
    padding:1em 2em;border-radius:2px;text-decoration:none;transition:transform .15s ease,background .2s ease;}
  .btn:hover{background:var(--gold-bright);transform:translateY(-2px);}
  .back{display:block;margin-top:2rem;color:#8f9bb0;font-size:.9rem;text-decoration:none;}
  .back:hover{color:var(--gold);}
  .tag{font-family:var(--serif);font-style:italic;color:#8f9bb0;margin-top:2.6rem;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo-white.png" alt="Padilla Advisory Group" />
    <p class="eyebrow">You're all set</p>
    <h1>Your Playbook is ready.</h1>
    <p>Thanks. The LA Downsizer's Playbook is yours below. When you're ready to talk through your own numbers, Alex is a call or text away at (424) 344-8164.</p>
    <a class="btn" href="/assets/la-downsizers-playbook.pdf" download>Download the Playbook (PDF)</a>
    <a class="back" href="/">&larr; Back to padillaadvisorygroup.com</a>
    <p class="tag">Guiding your next chapter.</p>
  </div>
</body>
</html>
